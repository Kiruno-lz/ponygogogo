
name = "ponygogogo"
compatibility_date = "2026-09-19"
main = "./scripts/Wrangler/worker/collection.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/collection*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "COLLECTION_DB"
database_name = "ponygogogo-collection-production"
database_id = "7d4d0abe-297c-4ae3-ba58-253eb4cda37a"
migrations_dir = "scripts/Wrangler/migrations"

[env.preview]
name = "ponygogogo-preview"

[[env.preview.d1_databases]]
binding = "COLLECTION_DB"
database_name = "ponygogogo-collection-preview"
database_id = "5e2b19ab-3c0d-43f6-8f17-0585df0da1a4"
migrations_dir = "scripts/Wrangler/migrations"
