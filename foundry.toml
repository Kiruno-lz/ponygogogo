[profile.default]
src = "contracts"
script = "scripts"
test = "tests/contracts"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# DeployPony.s.sol reads the deployer key file named by DEPLOYER_PRIVATE_KEY_PATH; out/ keeps vm.getCode working;
# the solver vector tests read tests/vectors.
fs_permissions = [
    { access = "read", path = "./keys" },
    { access = "read", path = "./out" },
    { access = "read", path = "./tests/vectors" },
]
# Monad runtime limit for local tests. Use bun run check:contracts to gate runtime, initcode and library links.
# Foundry 1.5.0 still uses Ethereum gas pricing; its gas numbers are regression measurements.
code_size_limit = 131072
