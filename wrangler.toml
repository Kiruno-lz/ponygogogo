
name = "ponygo"
compatibility_date = "2026-09-19"
main = "./scripts/Wrangler/worker/collection.ts"

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false
persist = false

[observability.traces]
enabled = false
persist = false

[observability.issues]
enabled = false

[vars]
KEEPER_RPC_URL = "https://testnet-rpc.monad.xyz"
KEEPER_GAME_ADDRESS = "0x84a319aa7dAdE1fBD49FE135bb70feeD937eCe82"
KEEPER_FROM_BLOCK = "69477594"

[triggers]
crons = ["*/2 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/collection*"]
not_found_handling = "none"

[[d1_databases]]
binding = "COLLECTION_DB"
database_name = "ponygogogo-collection-production"
database_id = "7d4d0abe-297c-4ae3-ba58-253eb4cda37a"
migrations_dir = "scripts/Wrangler/migrations"

[env.preview]
name = "ponygogogo-preview"

[env.preview.triggers]
crons = []

[[env.preview.d1_databases]]
binding = "COLLECTION_DB"
database_name = "ponygogogo-collection-preview"
database_id = "5e2b19ab-3c0d-43f6-8f17-0585df0da1a4"
migrations_dir = "scripts/Wrangler/migrations"
